<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h4>Signup Form</h4>
    <form action="">
        <table>
            <tr>
                <th>
                    Firstname:
                </th>
                <td>
                    <input type="text" name="Fname" placeholder="eg:John" minlength="3" required>
                </td>
            </tr>
            <tr>
                <th>
                    Lastname:
                </th>
                <td>
                    <input type="text" name="Lname" placeholder="eg:Doe" minlength="3" required>
                </td>
            </tr>
            <tr>
                <th>
                    Email:
                </th>
                <td>
                    <input type="email" name="email" placeholder="eg:johndoe@gmail.com" minlength="10" required>
                </td>
            </tr>
            <tr>
                <th>
                    Password:
                </th>
                <td>
                    <input type="password" name="pass" placeholder="eg:John@123" minlength="3" required>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <button>Submit</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
